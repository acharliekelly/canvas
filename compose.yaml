services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canvas}
      POSTGRES_USER: ${POSTGRES_USER:-canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvas-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - canvas-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-canvas-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-canvas-minio-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - canvas-minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-canvas-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-canvas-minio-local-password}
    volumes:
      - ./infrastructure/minio/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/create-bucket.sh"]

  caption-worker:
    build:
      context: ./caption-worker
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      CANVAS_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-canvas}
      POSTGRES_USER: ${POSTGRES_USER:-canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvas-local-password}
      CANVAS_ADMIN_USERNAME: ${CANVAS_ADMIN_USERNAME:-admin}
      CANVAS_ADMIN_PASSWORD_HASH: ${CANVAS_ADMIN_PASSWORD_HASH:-$$2a$$10$$7EqJtq98hPqEX7fNZaFWoOhi5dPrjtt1B8yINmwiQnKRD0b9nYnWi}
      CANVAS_PUBLIC_BASE_URL: ${CANVAS_PUBLIC_BASE_URL:-http://localhost:5173}
      CANVAS_UPLOAD_MAX_SIZE: ${CANVAS_UPLOAD_MAX_SIZE:-10MB}
      CANVAS_CAPTION_WORKER_URL: ${CANVAS_CAPTION_WORKER_URL:-http://caption-worker:8000}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      caption-worker:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  canvas-postgres-data:
  canvas-minio-data:
